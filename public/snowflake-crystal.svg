<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 冰晶主渐变：冰蓝到雪白 -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <!-- 高光渐变：顶部更亮 -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 主臂描边渐变 -->
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <!-- 中心冰珠光晕 -->
    <radialGradient id="coreGlow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 中心冰核光晕（冰的"呼吸感"） -->
  <circle cx="60" cy="60" r="34" fill="url(#coreGlow)"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 六条主臂（旋转 60° 一根），每根三层：阴影层/主体/高光 -->
    <g id="arm">
      <!-- 主臂：竖直向上 -->
      <line x1="60" y1="60" x2="60" y2="16" stroke="url(#armGrad)" stroke-width="5"/>
      <!-- 左分叉 -->
      <path d="M60 28 L51 19" stroke="url(#armGrad)" stroke-width="3.6"/>
      <path d="M60 28 L69 19" stroke="url(#armGrad)" stroke-width="3.6"/>
      <!-- 左二分叉（更像自然冰晶的层次） -->
      <path d="M60 42 L52 34" stroke="url(#armGrad)" stroke-width="3"/>
      <path d="M60 42 L68 34" stroke="url(#armGrad)" stroke-width="3"/>
      <!-- 主臂高光：细白线叠在臂中央 -->
      <line x1="60" y1="58" x2="60" y2="20" stroke="url(#shineGrad)" stroke-width="1.6"/>
    </g>
    <use href="#arm" transform="rotate(60 60 60)"/>
    <use href="#arm" transform="rotate(120 60 60)"/>
    <use href="#arm" transform="rotate(180 60 60)"/>
    <use href="#arm" transform="rotate(240 60 60)"/>
    <use href="#arm" transform="rotate(300 60 60)"/>
  </g>

  <!-- 中心冰珠：三层圆（外光圈/晶体/高光点） -->
  <circle cx="60" cy="60" r="7.5" fill="url(#iceGrad)" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="58" cy="57.5" r="2.2" fill="#ffffff" opacity="0.95"/>
</svg>
